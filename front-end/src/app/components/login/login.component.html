<div class="login-container">
  <form (ngSubmit)="onLogin()">
    <h2>Ingreso</h2>

    <div class="input-group">
      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Usuario"
        required
        [disabled]="isLoading"
      />
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Contraseña"
        required
        [disabled]="isLoading"
      />
    </div>

    <button type="submit" class="btn" [disabled]="isLoading">
      <ng-container *ngIf="!isLoading; else loadingBtn">
        Ingresar
      </ng-container>
      <ng-template #loadingBtn>
        <span class="spinner spinner--sm" aria-hidden="true"></span>
        <span class="btn-text">Ingresando…</span>
      </ng-template>
    </button>
  </form>
</div>

<div *ngIf="successMessage" class="alert alert-success">
  {{ successMessage }}
</div>
<div *ngIf="errorMessage" class="alert alert-danger">
  {{ errorMessage }}
</div>

<!-- Overlay de carga centrado (opcional, además del spinner del botón) -->
<div
  class="loading-overlay"
  *ngIf="isLoading"
  aria-live="polite"
  aria-busy="true"
>
  <div class="loading-overlay__box">
    <div class="spinner"></div>
    <div class="loading-overlay__text">Verificando credenciales…</div>
  </div>
</div>
